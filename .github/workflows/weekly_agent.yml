name: Slop Galaxy Weekly Agent

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

concurrency:
  group: slop-galaxy-agent
  cancel-in-progress: false

jobs:
  update-galaxy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # continue-on-error so nodes found before a health failure are still saved;
      # the final step re-raises the failure so GitHub emails you.
      - name: Run agent
        id: agent
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
        run: python scripts/slop_agent.py

      - name: Commit changes
        run: |
          git config user.name "Slop Galaxy Agent"
          git config user.email "agent@sloptilyoudrop.com"
          git add index.html agent_run_log.txt || true
          if ! git diff --staged --quiet; then
            git commit -m "agent: weekly node update $(date +%Y-%m-%d)"
            # rebase on top of anything you uploaded meanwhile instead of force-pushing over it
            git pull --rebase origin main
            git push origin main
          fi

      - name: Trigger Pages rebuild
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.repos.requestPagesBuild({
              owner: context.repo.owner,
              repo: context.repo.repo
            });

      - name: Fail run if agent health check failed
        if: steps.agent.outcome == 'failure'
        run: |
          echo "Agent step failed or source health check failed. See the 'Run agent' log."
          exit 1
